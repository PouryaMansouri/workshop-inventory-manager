server {
    listen 127.0.0.1:80;
    server_name 93.118.146.89 localhost;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/workshop-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$http_host$request_uri;
    }
}

server {
    listen 127.0.0.1:443 ssl;
    listen 8443 ssl;
    server_name 93.118.146.89 localhost;

    ssl_certificate /etc/ssl/workshop/fullchain.pem;
    ssl_certificate_key /etc/ssl/workshop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    error_page 497 https://$host:$server_port$request_uri;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        alias /opt/workshop/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /opt/workshop/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
