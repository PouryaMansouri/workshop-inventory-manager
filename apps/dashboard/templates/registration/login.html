<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود کاربر</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #fff;
      --text: #122033;
      --muted: #64748b;
      --border: #dbe3ef;
      --accent: #0f766e;
      --danger: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --surface: #121b2e;
        --text: #e5edf8;
        --muted: #9fb0c9;
        --border: #2a3956;
        --accent: #2dd4bf;
        --danger: #f87171;
      }
    }
    body { margin:0; font-family: Tahoma,"Segoe UI",sans-serif; background: var(--bg); color: var(--text); }
    .wrap { min-height: 100vh; display:grid; place-items:center; padding: 16px; }
    .card {
      width: 100%; max-width: 420px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 14px; padding: 20px;
      box-shadow: 0 14px 34px rgba(0,0,0,.12);
    }
    h1 { margin:0 0 6px; font-size: 1.35rem; }
    p { margin:0 0 16px; color: var(--muted); font-size: .93rem; }
    label { display:block; margin: 10px 0 6px; font-weight: 700; font-size: .88rem; }
    input {
      width:100%; box-sizing:border-box; border:1px solid var(--border); border-radius:10px;
      padding: 10px 12px; background: transparent; color: var(--text);
    }
    button {
      margin-top: 14px; width:100%; border:0; border-radius:10px; padding:10px 12px;
      background: var(--accent); color: #fff; font-weight: 700; cursor:pointer;
    }
    .err { margin: 8px 0 0; color: var(--danger); font-size: .87rem; }
    .hint { margin-top: 12px; color: var(--muted); font-size: .82rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>ورود برای پیگیری ابزار</h1>
      <p>با حساب کاربری خود وارد شوید تا ابزارهای در اختیار شما نمایش داده شود.</p>

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <label for="id_username">نام کاربری</label>
        <input id="id_username" type="text" name="username" required autofocus>

        <label for="id_password">رمز عبور</label>
        <input id="id_password" type="password" name="password" required>

        <input type="hidden" name="next" value="{{ next|default:'/my-tools/' }}">
        <button type="submit">ورود</button>

        {% if form.errors %}
          <div class="err">نام کاربری یا رمز عبور اشتباه است.</div>
        {% endif %}
      </form>

      <div class="hint">بعد از ورود به صفحه «ابزارهای من» منتقل می‌شوید.</div>
    </section>
  </main>
</body>
</html>
