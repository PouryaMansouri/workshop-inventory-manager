services:
  db:
    image: postgres:16
    container_name: workshop_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workshop_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-workshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workshop_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workshop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: workshop_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workshop_web
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-workshop}:${POSTGRES_PASSWORD:-workshop_pass}@db:5432/${POSTGRES_DB:-workshop_inventory}
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DB: ${POSTGRES_DB:-workshop_inventory}
      POSTGRES_USER: ${POSTGRES_USER:-workshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workshop_pass}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/admin/login/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workshop_test
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
    command: >
      sh -c "python manage.py migrate --noinput &&
             pytest -q"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    profiles:
      - test

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
